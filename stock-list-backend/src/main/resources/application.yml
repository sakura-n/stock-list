server:
  port: 8090

spring:
  application:
    name: stock-list-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: jdbc:h2:file:${user.home}/.stock-list/data/stockdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # 数据与照片统一落在用户主目录，保证打包后（程序所在目录只读）可写、换机器不串数据
  upload-dir: ${user.home}/.stock-list/uploads
  # 打包为桌面程序时由 jpackage 传入 -Dapp.open-browser=true，启动后自动弹浏览器；开发环境默认关
  open-browser: false
