name: Build Desktop App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]          # 推送 v1.0.0 之类的标签即触发发布 Release
  release:
    types: [ published ]

permissions:
  contents: write           # release 任务需要创建发布

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: bash build-desktop.sh
            artifact: StockList-mac-app
          - os: windows-latest
            script: pwsh ./build-desktop.ps1
            artifact: StockList-win-app
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build desktop app (${{ matrix.os }})
        run: ${{ matrix.script }}

      - name: Zip artifact (mac)
        if: runner.os == 'macOS'
        run: cd stock-list-backend/dist-desktop && zip -r -q "${{ matrix.artifact }}.zip" "囤货清单.app"

      - name: Zip artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "stock-list-backend\dist-desktop\StockList" -DestinationPath "stock-list-backend\dist-desktop\${{ matrix.artifact }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stock-list-backend/dist-desktop/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')   # 仅标签推送才发布
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: ls -R release-assets

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/StockList-mac-app/StockList-mac-app.zip
            release-assets/StockList-win-app/StockList-win-app.zip
          generate_release_notes: true
          fail_on_missing_files: true
